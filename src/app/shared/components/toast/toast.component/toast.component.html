<div class="toast-container" *ngIf="(notifications$ | async)?.length">
    <div *ngFor="let notification of notifications$ | async" class="toast"
        [class.toast--success]="notification.type === 'success'" [class.toast--error]="notification.type === 'error'"
        [class.toast--info]="notification.type === 'info'" role="alert">
        <span class="toast__message">{{ notification.message }}</span>
        <button type="button" class="toast__dismiss" aria-label="Dismiss notification"
            (click)="dismiss(notification.id)">
            &times;
        </button>
    </div>
</div>
