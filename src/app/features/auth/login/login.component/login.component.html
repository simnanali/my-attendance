<div class="auth-page">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <h1 class="auth-card__title">Log In</h1>

        <div class="form-field">
            <label for="username">Username</label>
            <input id="username" type="text" formControlName="username" autocomplete="username"
                [attr.aria-invalid]="username?.invalid && username?.touched ? true : null"
                aria-describedby="username-error" />
            <p class="form-error" id="username-error" *ngIf="username?.invalid && username?.touched">
                Username is required.
            </p>
        </div>

        <div class="form-field">
            <label for="password">Password</label>
            <input id="password" type="password" formControlName="password" autocomplete="current-password"
                [attr.aria-invalid]="password?.invalid && password?.touched ? true : null"
                aria-describedby="password-error" />
            <p class="form-error" id="password-error" *ngIf="password?.invalid && password?.touched">
                Password is required.
            </p>
        </div>

        <p class="form-error form-error--server" *ngIf="errorMessage()" role="alert">
            {{ errorMessage() }}
        </p>

        <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
            {{ isSubmitting() ? 'Logging in...' : 'Log In' }}
        </button>

        <p class="auth-card__footer">
            Don't have an account? <a routerLink="/register">Register</a>
        </p>
    </form>
</div>
